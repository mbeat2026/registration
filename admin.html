<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-BEAT Registration — Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --ink: #16211E; --paper: #F5F3EC; --panel: #FFFFFF;
  --teal: #0F3D3E; --teal-deep: #0A2C2D; --leaf: #3D8361;
  --amber: #C7811A; --rust: #B4472F; --line: #D8D3C4; --muted: #6B7570;
  --font-head: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
  --radius: 4px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-head); margin: 0; letter-spacing: -0.01em; }
button { font-family: var(--font-body); cursor: pointer; }

.shell { max-width: 1080px; margin: 0 auto; padding: 0 20px 64px; }

.topbar {
  background: var(--teal); color: #EDEBDF; padding: 14px 20px;
  display: flex; align-items: center; gap: 14px; border-bottom: 3px solid var(--leaf);
}
.topbar .brand strong { font-family: var(--font-head); font-size: 17px; font-weight: 700; }
.topbar .brand span { display: block; font-size: 11.5px; color: rgba(237,235,223,0.7); }

.login-wrap { display: flex; justify-content: center; padding-top: 48px; }
.login-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 36px 32px; width: 100%; max-width: 380px; }
.login-card h1 { font-size: 22px; margin-bottom: 6px; }
.login-card p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 24px; }

.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: var(--teal-deep); }
.field input { width: 100%; padding: 11px 12px; font-size: 15px; border: 1.5px solid var(--line); border-radius: var(--radius); font-family: var(--font-body); background: var(--paper); }
.field input:focus { outline: none; border-color: var(--leaf); background: #fff; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: var(--radius); border: none; font-weight: 600; font-size: 14.5px; width: 100%; background: var(--teal); color: #fff; }
.btn:hover { background: var(--teal-deep); }
.btn:disabled { background: #B8BDB9; cursor: not-allowed; }
.btn-outline { background: transparent; border: 1.5px solid var(--teal); color: var(--teal); width: auto; padding: 9px 16px; font-size: 13.5px; }
.btn-outline:hover { background: var(--teal); color: #fff; }

.error-msg { background: #FBEAE5; color: var(--rust); border: 1px solid #EBBFB2; padding: 10px 12px; border-radius: var(--radius); font-size: 13.5px; margin-bottom: 14px; }

.session-bar { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 12.5px; color: var(--muted); }
.session-bar .timer { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--teal); }
.session-bar .logout-link { margin-left: auto; color: var(--rust); font-weight: 600; cursor: pointer; }

.admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
@media (max-width: 800px) { .admin-grid { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 20px; }
.panel.wide { grid-column: 1 / -1; }
.panel h3 { font-size: 15px; margin-bottom: 4px; }
.panel p.hint { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
.panel .btn { width: auto; padding: 9px 16px; font-size: 13.5px; }
.row-flex { display: flex; gap: 10px; }
.row-flex .field { flex: 1; }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <strong>M-BEAT Registration — Admin</strong>
    <span>Colleges &amp; Student Registrations</span>
  </div>
</div>

<div class="shell">

  <div id="loginView" class="login-wrap" style="display:none;">
    <div class="login-card">
      <h1>Admin sign in</h1>
      <p class="sub">Coordination cell access only.</p>
      <div id="loginError"></div>
      <div class="field"><label for="adminPass">Admin password</label><input type="password" id="adminPass" autocomplete="off"></div>
      <button class="btn" id="adminLoginBtn">Sign in</button>
    </div>
  </div>

  <div id="adminMain" style="display:none;">
    <div class="session-bar">
      <span>Admin session</span>
      <span>· expires in <span class="timer" id="sessionTimer">15:00</span></span>
      <span class="logout-link" id="logoutBtn">Sign out</span>
    </div>

    <div class="admin-grid">

      <div class="panel">
        <h3>Colleges</h3>
        <p class="hint">Powers the college dropdown + auto-filled category/location on the registration page.</p>
        <div class="field"><label>College name</label><input type="text" id="collegeName" placeholder="e.g. Loyola College (Autonomous), Chennai"></div>
        <div class="row-flex">
          <div class="field"><label>Category</label><input type="text" id="collegeCategory" placeholder="e.g. Autonomous"></div>
          <div class="field"><label>Location</label><input type="text" id="collegeLocation" placeholder="e.g. Nungambakkam, Chennai - 34"></div>
        </div>
        <button class="btn" id="addCollegeBtn">Add college</button>
        <div id="collegeListWrap" style="margin-top:14px;"></div>
      </div>

      <div class="panel wide">
        <h3>Student Registrations</h3>
        <button class="btn btn-outline" id="refreshApplicationsBtn">Refresh</button>
        <div id="applicationsTableWrap"></div>
      </div>

    </div>
  </div>

</div>

<script>
// ---- CONFIGURE THIS after deploying Code.gs (same URL as index.html) ----
const API_URL = 'https://script.google.com/macros/s/AKfycbxlcuBpTB1egZ-vFqiJ51X2L3uLmLDDZWZv5b0XOTJ0XURUj0ypjcWXakkImMOaXFndMw/exec';

let adminState = { token: null };

async function call(action, payload) {
  const body = Object.assign({ action, adminToken: adminState.token }, payload || {});
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}

function showLogin(msg) {
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('adminMain').style.display = 'none';
  document.getElementById('loginError').innerHTML = msg ? `<div class="error-msg">${msg}</div>` : '';
}
function showMain() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('adminMain').style.display = 'block';
}

let sessionInterval;
function startCountdown(seconds) {
  const expiresAt = Date.now() + seconds * 1000;
  clearInterval(sessionInterval);
  sessionInterval = setInterval(() => {
    const remaining = Math.max(0, Math.round((expiresAt - Date.now()) / 1000));
    const m = String(Math.floor(remaining / 60)).padStart(2, '0');
    const s = String(remaining % 60).padStart(2, '0');
    document.getElementById('sessionTimer').textContent = `${m}:${s}`;
    if (remaining <= 0) { clearInterval(sessionInterval); adminState.token = null; showLogin('Admin session expired. Sign in again.'); }
  }, 1000);
}

document.getElementById('adminLoginBtn').addEventListener('click', async () => {
  const pass = document.getElementById('adminPass').value;
  const r = await call('adminLogin', { password: pass });
  if (!r.ok) { showLogin(r.error); return; }
  adminState.token = r.token;
  startCountdown(r.sessionSeconds || 900);
  showMain();
  loadColleges();
  loadApplications();
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  adminState.token = null;
  clearInterval(sessionInterval);
  showLogin();
});

document.getElementById('addCollegeBtn').addEventListener('click', async () => {
  const name = document.getElementById('collegeName').value.trim();
  const category = document.getElementById('collegeCategory').value.trim();
  const location = document.getElementById('collegeLocation').value.trim();
  const r = await call('adminAddCollege', { name, category, location });
  alert(r.ok ? 'College added.' : r.error);
  if (r.ok) {
    document.getElementById('collegeName').value = '';
    document.getElementById('collegeCategory').value = '';
    document.getElementById('collegeLocation').value = '';
    loadColleges();
  }
});

async function loadColleges() {
  const r = await call('getColleges', {});
  if (!r.ok) return;
  const wrap = document.getElementById('collegeListWrap');
  let html = '<table><thead><tr><th>College</th><th>Category</th><th>Location</th><th></th></tr></thead><tbody>';
  r.colleges.forEach(c => {
    html += `<tr><td>${c.name}</td><td>${c.category}</td><td>${c.location}</td>
      <td><a href="#" onclick="removeCollege('${c.name.replace(/'/g, "\\'")}');return false;" style="color:var(--rust);">remove</a></td></tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}
async function removeCollege(name) {
  if (!confirm(`Remove ${name} from the registration dropdown?`)) return;
  const r = await call('adminRemoveCollege', { name });
  if (r.ok) loadColleges(); else alert(r.error);
}

document.getElementById('refreshApplicationsBtn').addEventListener('click', loadApplications);

async function loadApplications() {
  const r = await call('adminApplicationsList', {});
  if (!r.ok) return;
  const wrap = document.getElementById('applicationsTableWrap');
  let html = '<table><thead><tr><th>Submitted</th><th>College</th><th>Name</th><th>Gender</th><th>Mobile</th><th>DOB</th><th>Reg. No.</th><th>Hosteller</th><th>Personal Email</th><th>College Email</th><th>Address</th></tr></thead><tbody>';
  r.applications.forEach(a => {
    html += `<tr><td>${new Date(a.timestamp).toLocaleString('en-IN')}</td><td>${a.collegeName}</td><td>${a.name}</td><td>${a.gender}</td><td>${a.mobile}</td><td>${a.dob}</td><td>${a.regNumber}</td><td>${a.hosteller}</td><td>${a.personalEmail}</td><td>${a.collegeEmail}</td><td>${a.address}</td></tr>`;
  });
  html += '</tbody></table>';
  html += `<p style="font-size:12px;color:var(--muted);margin-top:10px;">${r.applications.length} registration(s) received.</p>`;
  wrap.innerHTML = html;
}

showLogin();
</script>
</body>
</html>
